<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chart convert thing</title>
<style>
:root{--bg:#ffffff00;--card:#f3f3f3;--text:#222;--muted:#777;--border:#ddd;--accent:#000000;--accent-text:#fff;--input:#e6e6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181818;--card:#222;--text:#eee;--muted:#999;--border:#333;--input:#2e2e2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181818;--card:#222;--text:#eee;--muted:#999;--border:#333;--input:#2e2e2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;font-weight:500;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);padding:16px;margin-bottom:12px}
.h{font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.drop{background:var(--input);padding:28px 14px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{background:var(--accent);color:var(--accent-text)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 16px;margin-top:6px}
.opts label{display:flex;gap:8px;align-items:center;font-size:.95rem}
select,input[type=number]{background:var(--input);color:var(--text);border:0;border-radius:0;padding:5px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
button{background:var(--accent);color:var(--accent-text);border:0;border-radius:0;padding:10px 18px;font-weight:500;font-size:1rem;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.stat{color:var(--muted);font-size:.92rem}
.err{color:#e5484d;font-weight:600}
ol{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<main>
<h1>FNF → Scratch List Converter</h1>
<p class="sub">Turns a Psych Engine chart JSON into list items formatted <code>{time}: {lane}: {0}</code>.</p>

<div class="card">
  <div class="h">1. Load chart</div>
  <div class="drop" id="drop">Drop a .json chart here or click to choose a file</div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <div class="stat" id="stat" style="margin-top:8px"></div>
</div>

<div class="card">
  <div class="h">2. Options</div>
  <div class="opts">
    <label><input type="checkbox" id="braces" checked> Wrap values in { } like the example</label>
    <label><input type="checkbox" id="norm"> Make first note start at 0</label>
    <label><input type="checkbox" id="delta"> Use delay since previous note</label>
    <label><input type="checkbox" id="swap"> Swap lanes (opponent 5-8, player 1-4)</label>
    <label>Decimals <input type="number" id="dec" min="0" max="9" value="6" style="width:60px"></label>
    <label>Sort by time <select id="sort"><option value="1">Yes</option><option value="0">Keep chart order</option></select></label>
  </div>
</div>

<div class="card">
  <div class="h">3. Download</div>
  <div class="row" style="margin-top:0"><button id="dl" disabled>Download Scratch list (.txt)</button><span class="stat" id="dstat"></span></div>
  <ol>
    <li>In Scratch, right-click your list → <b>import</b>.</li>
    <li>Pick the downloaded .txt file.</li>
  </ol>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), file = $('file');
let song = null, baseName = 'chart', lines = [], downloads = null;

claude.use('downloads').then(d => { downloads = d; }).catch(() => {});

function load(f){
  baseName = f.name.replace(/\.json$/i, '') || 'chart';
  $('stat').className = 'stat'; $('stat').textContent = 'Reading ' + f.name + '…';
  const r = new FileReader();
  r.onload = () => {
    try { const data = JSON.parse(r.result); song = data.song && typeof data.song === 'object' ? data.song : data; }
    catch(e){ song = null; fail('Invalid JSON: ' + e.message); return; }
    convert();
  };
  r.onerror = () => fail('Couldn’t read that file.');
  r.readAsText(f);
}
function fail(msg){ lines = []; $('dl').disabled = true; $('stat').textContent = msg; $('stat').className = 'stat err'; }

drop.onclick = () => file.click();
file.onchange = () => file.files[0] && load(file.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); };

function convert(){
  if(!song) return;
  const sections = song.notes;
  if(!Array.isArray(sections)) return fail('Couldn’t find a "notes" array in this chart.');
  const swap = $('swap').checked, notes = [];
  for(const sec of sections){
    if(!sec || !Array.isArray(sec.sectionNotes)) continue;
    for(const n of sec.sectionNotes){
      if(!Array.isArray(n) || typeof n[0] !== 'number' || typeof n[1] !== 'number' || n[1] < 0) continue;
      let player = !!sec.mustHitSection;
      if(n[1] > 3) player = !player;
      if(swap) player = !player;
      notes.push({ t: n[0] / 1000, lane: (n[1] % 4) + 1 + (player ? 4 : 0) });
    }
  }
  if($('sort').value === '1') notes.sort((a,b) => a.t - b.t || a.lane - b.lane);
  if($('norm').checked && notes.length){
    let t0 = Infinity; for(const n of notes) if(n.t < t0) t0 = n.t;
    for(const n of notes) n.t -= t0;
  }
  if($('delta').checked){
    let prev = null;
    for(const n of notes){ const t = n.t; n.t = prev === null ? t : t - prev; prev = t; }
  }
  const dec = Math.max(0, Math.min(9, parseInt($('dec').value) || 0));
  const w = $('braces').checked ? v => '{' + v + '}' : v => String(v);
  lines = notes.map(n => `${w(+n.t.toFixed(dec))}: ${w(n.lane)}: ${w(0)}`);
  $('stat').className = 'stat';
  $('stat').textContent = lines.length.toLocaleString() + ' notes ready' + (typeof song.song === 'string' ? ' from “' + song.song + '”' : '') + '.';
  $('dl').disabled = lines.length === 0;
  $('dstat').textContent = '';
}
['braces','norm','delta','swap','dec','sort'].forEach(id => $(id).addEventListener('change', convert));

$('dl').onclick = async () => {
  if(!lines.length) return;
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const name = baseName + '_scratch.txt';
  try {
    if(downloads){ await downloads.save({ filename: name, data: blob }); $('dstat').textContent = 'Saved.'; }
    else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }
  } catch(e){ $('dstat').textContent = e && e.code === 'declined' ? 'Download cancelled.' : 'Download failed' + (e && e.message ? ': ' + e.message : '.'); }
};
</script>
</body>
</html>
